name: Dogfood acceptance
on: [pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.2
          cache: false
      - run: npm ci && make verify
      - name: Streaming load with worker restart
        run: node --import tsx scripts/agent-load.ts
      - name: Install age for backup acceptance
        run: go install filippo.io/age/cmd/...@v1.2.1
      - name: Backup interruption and restore verification
        run: bash scripts/backup-job-test.sh
      - name: Idle CPU and resident memory per process
        if: runner.os == 'Linux'
        run: node --import tsx scripts/engine-cost.ts
